    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const router = express.Router();
const { requireAdmin } = require(&#039;../middleware/auth&#039;);
const supabase = require(&#039;../utils/supabase&#039;);

// ===== helper =====
function priceBins(products) {
  const bins = [
    { label: &#039;&lt;500&#039;,   min: 0,    max: 500,      count: 0 },
    { label: &#039;500-1K&#039;, min: 500,  max: 1000,     count: 0 },
    { label: &#039;1K-3K&#039;,  min: 1000, max: 3000,     count: 0 },
    { label: &#039;3K-5K&#039;,  min: 3000, max: 5000,     count: 0 },
    { label: &#039;5K+&#039;,    min: 5000, max: Infinity, count: 0 },
  ];
  products.forEach(p =&gt; {
    const price = Number(p.price);
    const bin = bins.find(b =&gt; price &gt;= b.min &amp;&amp; price &lt; b.max);
    if (bin) bin.count++;
  });
  return bins;
}

function topCategories(products) {
  const map = {};
  products.forEach(p =&gt; {
    const cat = p.category || &#039;ไม่ระบุ&#039;;
    map[cat] = (map[cat] || 0) + 1;
  });
  return Object.entries(map)
    .sort((a, b) =&gt; b[1] - a[1])
    .slice(0, 6)
    .map(([name, count]) =&gt; ({ name, count }));
}

// ===== GET Dashboard =====
router.get(&#039;/&#039;, requireAdmin, async (req, res) =&gt; {
  const { data: products } = await supabase.from(&#039;products&#039;).select(&#039;*&#039;);
  const { data: users } = await supabase.from(&#039;users&#039;).select(&#039;*&#039;);
  const { data: categories } = await supabase.from(&#039;categories&#039;).select(&#039;*&#039;);
  const { data: logs } = await supabase.from(&#039;logs&#039;).select(&#039;*&#039;);

  const safeProducts = products || [];
  const safeUsers = users || [];
  const safeCategories = categories || [];
  const safeLogs = logs || [];

  const totalValue = safeProducts.reduce((s, p) =&gt; s + Number(p.price || 0), 0);
  const avgPrice = safeProducts.length ? Math.round(totalValue / safeProducts.length) : 0;

  const shopeeCount = safeProducts.filter(p =&gt; p.platform === &#039;shopee&#039;).length;
  const lazadaCount = safeProducts.filter(p =&gt; p.platform === &#039;lazada&#039;).length;
  const otherCount = safeProducts.length - shopeeCount - lazadaCount;
  const promoCount = safeProducts.filter(p =&gt; p.isPromo).length;

  const maxPlatform = Math.max(shopeeCount, lazadaCount, otherCount) || 1;

  const topProduct = safeProducts.reduce((best, p) =&gt;
    Number(p.price) &gt; Number((best &amp;&amp; best.price) || 0) ? p : best, null);

  const cheapProduct = safeProducts.length
    ? safeProducts.reduce((low, p) =&gt; Number(p.price) &lt; Number(low.price) ? p : low)
    : null;

  const today = new Date().toDateString();
  const logsToday = safeLogs.filter(l =&gt;
    new Date(l.time).toDateString() === today
  ).length;

  const bins = priceBins(safeProducts);
  const maxBin = Math.max(...bins.map(b =&gt; b.count)) || 1;

  const catBreakdown = topCategories(safeProducts);
  const dotColors = [&#039;#45B3E0&#039;,&#039;#4caf86&#039;,&#039;#f0a050&#039;,&#039;#7C6FD4&#039;,&#039;#e06b6b&#039;,&#039;#f5c842&#039;];

  res.render(&#039;admin/dashboard&#039;, {
    activePage: &#039;dashboard&#039;,
    title: &#039;Dashboard&#039;,
    products: safeProducts,
    users: safeUsers,
    categories: safeCategories,
    logs: safeLogs.slice(0, 8),
    stats: {
      total: safeProducts.length,
      totalValue,
      avgPrice,
      shopeeCount,
      lazadaCount,
      otherCount,
      promoCount,
      userCount: safeUsers.length,
      categoryCount: safeCategories.length,
      logsToday,
      maxPlatform,
      topProduct,
      cheapProduct
    },
    bins,
    maxBin,
    catBreakdown,
    dotColors
  });
});


// ===== Products =====
router.get(&#039;/products&#039;, requireAdmin, async (req, res) =&gt; {
  const { data: products } = await supabase.from(&#039;products&#039;).select(&#039;*&#039;);

  res.render(&#039;admin/products&#039;, {
    activePage: &#039;products&#039;,
    title: &#039;จัดการสินค้า&#039;,
    products: products || []
  });
});


// ===== Categories =====
router.get(&#039;/categories&#039;, requireAdmin, async (req, res) =&gt; {
  const { data: categories } = await supabase.from(&#039;categories&#039;).select(&#039;*&#039;);
  const { data: products } = await supabase.from(&#039;products&#039;).select(&#039;*&#039;);

  const safeCategories = categories || [];
  const safeProducts = products || [];

  res.render(&#039;admin/categories&#039;, {
    activePage: &#039;categories&#039;,
    title: &#039;จัดการหมวดหมู่&#039;,
    categories: safeCategories.map(c =&gt; ({
      ...c,
      count: safeProducts.filter(p =&gt; p.category === c.name).length
    }))
  });
});


// ===== Users =====
router.get(&#039;/users&#039;, requireAdmin, async (req, res) =&gt; {
  const { data: users } = await supabase.from(&#039;users&#039;).select(&#039;*&#039;);

  res.render(&#039;admin/users&#039;, {
    activePage: &#039;users&#039;,
    title: &#039;จัดการผู้ใช้งาน&#039;,
    users: users || [],
    notice: typeof req.query.notice === &#039;string&#039; ? req.query.notice : null,
    error: typeof req.query.error === &#039;string&#039; ? req.query.error : null
  });
});


// ===== Logs =====
router.get(&#039;/logs&#039;, requireAdmin, async (req, res) =&gt; {
  const { data: logs } = await supabase.from(&#039;logs&#039;).select(&#039;*&#039;);

  res.render(&#039;admin/logs&#039;, {
    activePage: &#039;logs&#039;,
    title: &#039;Purchase Logs&#039;,
    logs: logs || []
  });
});


// ===== Delete User =====
router.post(&#039;/users/delete/:id&#039;, requireAdmin, async (req, res) =&gt; {
  const targetUserId = req.params.id;

  if (targetUserId === req.session.user.id) {
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ไม่สามารถลบบัญชีตัวเองได้&#039;));
  }

  const { data: targetUser, error: targetUserError } = await supabase
    .from(&#039;users&#039;)
    .select(&#039;id, role&#039;)
    .eq(&#039;id&#039;, targetUserId)
    .maybeSingle();

  if (targetUserError) {
    console.error(&#039;ADMIN DELETE USER LOOKUP ERROR:&#039;, targetUserError);
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ไม่สามารถค้นหาบัญชีผู้ใช้ได้&#039;));
  }

  if (!targetUser) {
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ไม่พบบัญชีผู้ใช้&#039;));
  }

  if (targetUser.role === &#039;admin&#039;) {
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ไม่สามารถลบบัญชีแอดมินได้&#039;));
  }

  // Remove dependent rows first so FK constraints won&#039;t block deleting user.
  const dependentTargets = [
    { table: &#039;products&#039;, column: &#039;createdBy&#039; },
    { table: &#039;categories&#039;, column: &#039;createdBy&#039; }
  ];

  for (const item of dependentTargets) {
    const { error } = await supabase
      .from(item.table)
      .delete()
      .eq(item.column, targetUserId);

    if (error) {
      console.error(`ADMIN DELETE USER DEPENDENCY ERROR (${item.table}):`, error);
      return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ลบข้อมูลที่เกี่ยวข้องไม่สำเร็จ&#039;));
    }
  }

  const { error: deleteUserError } = await supabase
    .from(&#039;users&#039;)
    .delete()
    .eq(&#039;id&#039;, targetUserId)
    .select(&#039;id&#039;);

  if (deleteUserError) {
    console.error(&#039;ADMIN DELETE USER ERROR:&#039;, deleteUserError);
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ลบผู้ใช้ไม่สำเร็จ&#039;));
  }

  // Supabase can return no error but delete 0 rows (e.g., blocked by RLS policy).
  const { data: verifyUserStillExists, error: verifyError } = await supabase
    .from(&#039;users&#039;)
    .select(&#039;id&#039;)
    .eq(&#039;id&#039;, targetUserId)
    .maybeSingle();

  if (verifyError) {
    console.error(&#039;ADMIN DELETE USER VERIFY ERROR:&#039;, verifyError);
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ลบแล้วแต่ตรวจสอบผลลัพธ์ไม่สำเร็จ&#039;));
  }

  if (verifyUserStillExists) {
    return res.redirect(&#039;/admin/users?error=&#039; + encodeURIComponent(&#039;ลบไม่สำเร็จ: ไม่มีสิทธิ์ลบผู้ใช้ (RLS)&#039;));
  }

  return res.redirect(&#039;/admin/users?notice=&#039; + encodeURIComponent(&#039;ลบผู้ใช้สำเร็จ&#039;));
});

module.exports = router;</textarea>
