<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const router = express.Router();
const { v4: uuidv4 } = require(&#039;uuid&#039;);
const { requireLogin } = require(&#039;../middleware/auth&#039;);
const supabase = require(&#039;../utils/supabase&#039;);

// POST Add product
router.post(&#039;/add&#039;, requireLogin, async (req, res) =&gt; {
  const { name, price, platform, category, link, description, imgUrl, isPromo } = req.body;

  if (!name || !price) {
    return res.redirect(&#039;/wishlist?error=missing&#039;);
  }

  const newProduct = {
    id: uuidv4(),
    name: name.trim(),
    price: Number(price),
    platform: platform || &#039;other&#039;,
    category: category ? category.trim() : &#039;&#039;,
    link: link ? link.trim() : &#039;&#039;,
    description: description ? description.trim() : &#039;&#039;,
    imgUrl: imgUrl ? imgUrl.trim() : &#039;&#039;,
    isPromo: isPromo === &#039;on&#039;,
    createdBy: req.session.user.id,
    createdAt: new Date().toISOString()
  };

  // 👉 insert product
  const { error } = await supabase.from(&#039;products&#039;).insert([newProduct]);
  if (error) {
    console.error(error);
    return res.status(500).send(&#039;Error adding product&#039;);
  }

  // 👉 add category if not exists
  if (newProduct.category) {
    const { data: categories } = await supabase.from(&#039;categories&#039;).select(&#039;*&#039;);

    if (!categories.find(c =&gt; c.name === newProduct.category)) {
      await supabase.from(&#039;categories&#039;).insert([
        { id: uuidv4(), name: newProduct.category }
      ]);
    }
  }

  res.redirect(&#039;/product/&#039; + newProduct.id);
});

// POST Edit product
router.post(&#039;/edit/:id&#039;, requireLogin, async (req, res) =&gt; {
  const { name, price, platform, category, link, description, imgUrl, isPromo } = req.body;

  const { data: products } = await supabase
    .from(&#039;products&#039;)
    .select(&#039;*&#039;)
    .eq(&#039;id&#039;, req.params.id)
    .single();

  if (!products) {
    return res.status(404).render(&#039;error&#039;, { message: &#039;ไม่พบสินค้า&#039; });
  }

  // check permission
  if (
    products.createdBy !== req.session.user.id &amp;&amp;
    req.session.user.role !== &#039;admin&#039;
  ) {
    return res.status(403).render(&#039;error&#039;, { message: &#039;ไม่มีสิทธิ์แก้ไขสินค้านี้&#039; });
  }

  const updatedProduct = {
    name: name.trim(),
    price: Number(price),
    platform: platform || &#039;other&#039;,
    category: category ? category.trim() : &#039;&#039;,
    link: link ? link.trim() : &#039;&#039;,
    description: description ? description.trim() : &#039;&#039;,
    imgUrl: imgUrl ? imgUrl.trim() : &#039;&#039;,
    isPromo: isPromo === &#039;on&#039;,
    updatedAt: new Date().toISOString()
  };

  const { error } = await supabase
    .from(&#039;products&#039;)
    .update(updatedProduct)
    .eq(&#039;id&#039;, req.params.id);

  if (error) {
    console.error(error);
    return res.status(500).send(&#039;Error updating product&#039;);
  }

  // add category if new
  if (updatedProduct.category) {
    const { data: categories } = await supabase.from(&#039;categories&#039;).select(&#039;*&#039;);

    if (!categories.find(c =&gt; c.name === updatedProduct.category)) {
      await supabase.from(&#039;categories&#039;).insert([
        { id: uuidv4(), name: updatedProduct.category }
      ]);
    }
  }

  res.redirect(&#039;/product/&#039; + req.params.id);
});

// POST Delete product
router.post(&#039;/delete/:id&#039;, requireLogin, async (req, res) =&gt; {
  const { data: product } = await supabase
    .from(&#039;products&#039;)
    .select(&#039;*&#039;)
    .eq(&#039;id&#039;, req.params.id)
    .single();

  if (!product) {
    return res.status(404).render(&#039;error&#039;, { message: &#039;ไม่พบสินค้า&#039; });
  }

  if (
    product.createdBy !== req.session.user.id &amp;&amp;
    req.session.user.role !== &#039;admin&#039;
  ) {
    return res.status(403).render(&#039;error&#039;, { message: &#039;ไม่มีสิทธิ์ลบสินค้านี้&#039; });
  }

  const { error } = await supabase
    .from(&#039;products&#039;)
    .delete()
    .eq(&#039;id&#039;, req.params.id);

  if (error) {
    console.error(error);
    return res.status(500).send(&#039;Error deleting product&#039;);
  }

  res.redirect(&#039;/wishlist&#039;);
});

// GET Edit form
router.get(&#039;/edit/:id&#039;, requireLogin, async (req, res) =&gt; {
  const { data: product } = await supabase
    .from(&#039;products&#039;)
    .select(&#039;*&#039;)
    .eq(&#039;id&#039;, req.params.id)
    .single();

  if (!product) {
    return res.status(404).render(&#039;error&#039;, { message: &#039;ไม่พบสินค้า&#039; });
  }

  const { data: categories, error } = await supabase
    .from(&#039;categories&#039;)
    .select(&#039;*&#039;);

  if (error) {
    console.error(error);
  }

  res.render(&#039;product_form&#039;, {
    product,
    categories: categories || [], // ✅ แก้ตรงนี้
    mode: &#039;edit&#039;
  });
});


// GET Add form
router.get(&#039;/add&#039;, requireLogin, async (req, res) =&gt; {
  const { data: categories, error } = await supabase
    .from(&#039;categories&#039;)
    .select(&#039;*&#039;);

  if (error) {
    console.error(error);
  }

  res.render(&#039;product_form&#039;, {
    product: null,
    categories: categories || [], // ✅ แก้ตรงนี้
    mode: &#039;add&#039;
  });
});

module.exports = router;</textarea>
